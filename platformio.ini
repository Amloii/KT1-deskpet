; KT1 · PlatformIO build (alternative to Arduino IDE)
; Docs EN: docs/en/installation.md · ES: docs/es/installation.md
;
; Quick start:
;   pip install platformio
;   cp firmware/kt1-deskpet/secrets.example.h firmware/kt1-deskpet/secrets.h
;   pio run                  ; compile (Huge APP, no OTA — simplest)
;   pio run -e kt1-ota -t upload --upload-port COMx
;
; NOTE on TFT_eSPI: like in Arduino IDE, enable only FNK0104AB_2P8_240x320_ILI9341
; in .pio/libdeps/<env>/TFT_eSPI/User_Setup_Select.h after first `pio run`
; (see docs/en/installation.md §3).

[platformio]
default_envs = kt1
src_dir = firmware/kt1-deskpet

[env:kt1-base]
framework = arduino
; Official espressif32 platform tops out at Arduino 2.0.17, but KT1 needs
; Arduino 3.x (ESP_I2S.h, driver/i2s_std.h). pioarduino 53.03.11 = Arduino 3.1.1
; (matches docs/en/installation.md "tested with 3.1.1").
platform = https://github.com/pioarduino/platform-espressif32.git#53.03.11
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = chain+
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@^7.4.3
  https://github.com/Freenove/Freenove_WS2812_Lib_for_ESP32.git
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12 ; 3-arg ctor + setVolume(vol,curve) + i2s_std (needs Arduino 3.x; >=3.1 changed ctor, avoid >=3.1)
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSB_CDC_ON_BOOT=1
  ; Arduino 3 splits core features across libraries (Network, FS, ...) and LDF
  ; records no edges between framework libraries, so every sibling include dir
  ; used by the built libs must be listed here (audited 2026-10-08, Arduino 3.1.1).
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/HTTPClient/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/NetworkClientSecure/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Update/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src
  -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SD/src
extra_scripts = tools/pio_patch_tft.py

; Simplest: 3 MB app, no OTA (matches Arduino "Huge APP" option in installation.md §5)
[env:kt1]
extends = env:kt1-base
board_build.partitions = huge_app.csv

; OTA: two ~3 MB app slots (matches Arduino "16M Flash (3MB APP/9.9MB FATFS)" option)
[env:kt1-ota]
extends = env:kt1-base
board_build.partitions = firmware/partitions-ota-16M.csv
