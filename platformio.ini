; KT1 · PlatformIO build (alternative to Arduino IDE)
; Docs EN: docs/en/installation.md · ES: docs/es/installation.md
;
; Quick start:
;   pip install platformio
;   cp firmware/kt1-deskpet/secrets.example.h firmware/kt1-deskpet/secrets.h
;   pio run                  ; compile (Huge APP, no OTA — simplest)
;   pio run -e kt1-ota -t upload --upload-port COMx
;
; NOTE on TFT_eSPI: like in Arduino IDE, enable only FNK0104AB_2P8_240x320_ILI9341
; in .pio/libdeps/<env>/TFT_eSPI/User_Setup_Select.h after first `pio run`
; (see docs/en/installation.md §3).

[platformio]
default_envs = kt1
src_dir = firmware/kt1-deskpet

[env:kt1-base]
framework = arduino
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = chain+
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@^7.4.3
  https://github.com/Freenove/Freenove_WS2812_Lib_for_ESP32.git
  https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6 ; registry has no 2.0.x; 2.0.6 = latest 2.0 API (docs: avoid >=3.0)
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSB_CDC_ON_BOOT=1
extra_scripts = tools/pio_patch_tft.py

; Simplest: 3 MB app, no OTA (matches Arduino "Huge APP" option in installation.md §5)
[env:kt1]
extends = env:kt1-base
board_build.partitions = huge_app.csv

; OTA: two ~3 MB app slots (matches Arduino "16M Flash (3MB APP/9.9MB FATFS)" option)
[env:kt1-ota]
extends = env:kt1-base
board_build.partitions = firmware/partitions-ota-16M.csv
