<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" role="img" aria-label="KT1 wiring overview">
<rect width="640" height="200" fill="#0f172a"/>
<text x="20" y="34" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">KT1 wiring — 3V3 only, never 5V</text>
<rect x="20" y="50" width="220" height="120" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="34" y="76" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">Freenove FNK0104B</text>
<text x="34" y="96" fill="#e2e8f0" font-family="monospace" font-size="11">I2C: 3V3 SDA16 SCL15 GND</text>
<text x="34" y="114" fill="#e2e8f0" font-family="monospace" font-size="11">IO2 (pet)  IO14 (DHT)</text>
<text x="34" y="132" fill="#e2e8f0" font-family="monospace" font-size="11">IO3 (LDR)  sides per silk</text>
<text x="34" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">Full map: docs/en/hardware.md §3</text>
<rect x="270" y="50" width="100" height="52" rx="8" fill="#1e293b" stroke="#facc15"/>
<text x="280" y="72" fill="#facc15" font-family="sans-serif" font-size="12" font-weight="bold">GY-521</text>
<text x="280" y="88" fill="#e2e8f0" font-family="monospace" font-size="10">SDA16 SCL15</text>
<rect x="270" y="112" width="100" height="58" rx="8" fill="#1e293b" stroke="#4ade80"/>
<text x="280" y="134" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">TTP223</text>
<text x="280" y="150" fill="#e2e8f0" font-family="monospace" font-size="10">DO -&gt; IO2</text>
<rect x="390" y="50" width="100" height="52" rx="8" fill="#1e293b" stroke="#4ade80"/>
<text x="400" y="72" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">DHT11</text>
<text x="400" y="88" fill="#e2e8f0" font-family="monospace" font-size="10">DATA -&gt; IO14</text>
<rect x="390" y="112" width="100" height="58" rx="8" fill="#1e293b" stroke="#4ade80"/>
<text x="400" y="134" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">KY-018</text>
<text x="400" y="150" fill="#e2e8f0" font-family="monospace" font-size="10">S -&gt; IO3</text>
<text x="510" y="100" fill="#f8fafc" font-family="sans-serif" font-size="12">3V3 rail</text>
<text x="510" y="120" fill="#f87171" font-family="monospace" font-size="11">red = 3V3</text>
<text x="510" y="138" fill="#e2e8f0" font-family="monospace" font-size="11">blk = GND</text>
</svg>
