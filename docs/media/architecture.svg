<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" role="img" aria-label="KT1 architecture">
<rect width="720" height="190" fill="#0f172a"/>
<text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="17" font-weight="bold">KT1 — ESP32-S3 + Windows companion + cloud (optional)</text>
<rect x="20" y="45" width="300" height="125" rx="10" fill="#1e293b" stroke="#38bdf8"/>
<text x="34" y="70" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">KT1 (ESP32-S3)</text>
<text x="34" y="90" fill="#e2e8f0" font-family="monospace" font-size="11">core1: touch pages coach render</text>
<text x="34" y="108" fill="#e2e8f0" font-family="monospace" font-size="11">core0: WiFi NTP weather server</text>
<text x="34" y="126" fill="#e2e8f0" font-family="monospace" font-size="11">mic -&gt; Gemini (+screenshot) -&gt; TTS</text>
<text x="34" y="144" fill="#94a3b8" font-family="sans-serif" font-size="11">Every sensor optional</text>
<rect x="340" y="45" width="180" height="125" rx="10" fill="#1e293b" stroke="#4ade80"/>
<text x="354" y="70" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">Windows PC</text>
<text x="354" y="90" fill="#e2e8f0" font-family="monospace" font-size="11">bridge.py :8750</text>
<text x="354" y="108" fill="#e2e8f0" font-family="monospace" font-size="11">volume apps TODO</text>
<text x="354" y="126" fill="#e2e8f0" font-family="monospace" font-size="11">reminders OTA OpenCode</text>
<text x="354" y="144" fill="#94a3b8" font-family="sans-serif" font-size="11">DND: calls / typing</text>
<rect x="540" y="45" width="160" height="125" rx="10" fill="#1e293b" stroke="#facc15"/>
<text x="554" y="70" fill="#facc15" font-family="sans-serif" font-size="13" font-weight="bold">Cloud (opt.)</text>
<text x="554" y="90" fill="#e2e8f0" font-family="monospace" font-size="11">Open-Meteo</text>
<text x="554" y="108" fill="#e2e8f0" font-family="monospace" font-size="11">Gemini</text>
<text x="554" y="126" fill="#e2e8f0" font-family="monospace" font-size="11">Translate TTS</text>
<text x="554" y="144" fill="#94a3b8" font-family="sans-serif" font-size="11">NTP</text>
<text x="320" y="115" fill="#f8fafc" font-family="sans-serif" font-size="16">⇄</text>
<text x="520" y="115" fill="#f8fafc" font-family="sans-serif" font-size="16">→</text>
</svg>
